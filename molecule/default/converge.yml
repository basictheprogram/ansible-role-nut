---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        force_apt_get: true
      changed_when: false
      when: ansible_os_family == 'Debian'

    - name: Update dnf cache
      ansible.builtin.dnf:
        update_cache: true
      changed_when: false
      when: ansible_os_family == 'RedHat'

  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      vars:
        # Disable service management — NUT services cannot run in Docker
        # without physical UPS hardware attached to the container host.
        nut_enable_service: false

        # Write all configuration files so testinfra can assert on them.
        nut_managed_config: true

        nut_mode: standalone

        nut_ups:
          - name: testups
            driver: dummy-ups
            device: testups.dev
            description: Molecule test UPS (no hardware required)

        # Both services in nut_services so upsd.conf, upsd.users, and
        # upsmon.conf are all added to nut_configuration_files.
        nut_services:
          - nut-server.service
          - nut-monitor.service

        nut_users:
          - name: testmonitor
            password: testpassword
            role: primary

        # Remote NUT servers monitored in addition to the local testups
        # UPS, exercising the multi-server MONITOR loop in upsmon.conf.j2.
        # remoteups3 omits role/port to verify the nut_upsmon_role and
        # nut_powervalue defaulting.
        nut_upsmon_monitors:
          - name: remoteups1
            host: remote1.example.test
            user: remoteuser1
            password: remotepass1
            role: secondary
          - name: remoteups2
            host: remote2.example.test
            port: 3493
            user: remoteuser2
            password: remotepass2
            role: secondary
          - name: remoteups3
            host: remote3.example.test
            user: remoteuser3
            password: remotepass3
