---

- name: "Include OS-specific variables."
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Run preflight assertions
  ansible.builtin.include_tasks: preflight.yml
  tags: nut

- name: "Define nut_packages."
  ansible.builtin.set_fact:
    nut_packages: "{{ (__nut_packages | list) + nut_extra_packages }}"
  when: nut_packages is not defined

- name: "Ensure NUT packages are installed."
  ansible.builtin.package:
    name: "{{ nut_packages }}"
    state: present

- name: "Define configuration files."
  ansible.builtin.set_fact:
    nut_configuration_files:
      - nut.conf

- name: "Add ups.conf to configuration files."
  ansible.builtin.set_fact:
    nut_configuration_files: "{{ nut_configuration_files + ['ups.conf'] }}"
  when: nut_ups | length > 0

- name: "Add upsd.users and upsd.conf to configuration files."
  ansible.builtin.set_fact:
    nut_configuration_files: "{{ nut_configuration_files + ['upsd.users', 'upsd.conf'] }}"
  when: ("nut-server" in nut_services) or ("nut-server.service" in nut_services)

- name: "Add upsmon.conf to configuration files."
  ansible.builtin.set_fact:
    nut_configuration_files: "{{ nut_configuration_files + ['upsmon.conf'] }}"
  when: ("nut-monitor" in nut_services) or ("nut-monitor.service" in nut_services)

- name: "Install NUT configuration files."
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ __nut_config_dir }}{{ item }}"
    owner: "root"
    group: "nut"
    mode: "0640"
  loop: "{{ nut_configuration_files }}"
  notify: "Restart nut"
  when: "nut_managed_config"

- name: "Remove stale NUT configuration files."
  ansible.builtin.file:
    path: "{{ __nut_config_dir }}{{ item }}"
    state: absent
  loop: "{{ __nut_all_config_files | difference(nut_configuration_files) }}"
  vars:
    __nut_all_config_files:
      - nut.conf
      - ups.conf
      - upsd.conf
      - upsd.users
      - upsmon.conf
  when: nut_managed_config
  notify: "Restart nut"

- name: Install custom notifycmd script.
  ansible.builtin.copy:
    dest: "{{ nut_upsmon_notifycmd }}"
    content: "{{ nut_upsmon_notifycmd_content }}"
    owner: "root"
    group: "nut"
    mode: "0770"
  when: "nut_upsmon_notifycmd_content is defined"
